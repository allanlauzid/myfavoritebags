<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4589608543845725"
     crossorigin="anonymous"></script>
<script>document.documentElement.classList.replace('no-js','js');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Favorite Match — Recife</title>
<meta name="description" content="Deslize e descubra as peças que combinam com você. My Favorite Bags & My Favorite Looks — Recife.">
<script>
  // Bloqueio/visibilidade controlado pelo painel central do My Favorite Bags (localStorage compartilhado)
  // ?preview=1 permite que o admin edite/visualize a página mesmo bloqueada, sem publicar.
  const _isPreview = new URLSearchParams(location.search).get('preview') === '1';
  // Padrão: visível (só bloqueia se o admin marcar explicitamente como "locked")
  // try/catch: localStorage pode lançar SecurityError com cookies/dados de
  // site bloqueados — sem proteção, este script (e o resto da página) morria.
  var _matchState = null;
  try { _matchState = localStorage.getItem('mfb_match_state'); } catch (_) {}
  if (!_isPreview && _matchState === 'locked') {
    location.replace('index.html');
  }
  
  // Oculta o botão My Favorite Looks no Match se estiver desativado no painel
  document.addEventListener('DOMContentLoaded', () => {
    try {
      const looksState = localStorage.getItem('mfb_looks_state') || 'visible';
      if (looksState !== 'visible') {
        const btn = document.getElementById('mConfigLooksBtn');
        if (btn) btn.style.display = 'none';
      }
    } catch (_) {}
  });
</script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cursor.css">
<link rel="stylesheet" href="css/curtain-shared.css">
<style>
:root {
  --rose:        #B55A38;
  --rose-dark:   #8A3F26;
  --rose-deep:   #4A2318;
  --bg:          #EDE1D3;
  --bg2:         #DFCEB8;
  --text:        #4A2318;
  --text-muted:  #8A6A57;
  --line:        rgba(138,63,38,.18);
  --ease:        cubic-bezier(.4,0,.2,1);
  --gold:        #C9A646;
  --blue:        #5B7FB8;
  --green:       #2E9E6B;
  --orange:      #C97A46;
}
*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }

/* ─── SCROLLBAR CUSTOMIZADA (global) ────────────────────────────────────────
   Sem trilho (track sempre transparente) e a barrinha some quando parada,
   só aparecendo ao passar o mouse sobre a área com rolagem. */
* {
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
*:hover {
  scrollbar-color:var(--rose-dark) transparent;
}
::-webkit-scrollbar { width:8px; height:8px; background:transparent; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:transparent; border-radius:10px; }
*:hover::-webkit-scrollbar-thumb { background:var(--rose-dark); }
::-webkit-scrollbar-thumb:hover { background:var(--rose-deep); }

body{
  font-family:'Jost',sans-serif;
  background:var(--rose-deep); /* área neutra marrom (tom da paleta) atrás do frame no desktop */
  color:var(--text);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}

/* ─── FRAME 9:16 fixo, mesmo em desktop ─────────────────────────────────
   Os valores finais de largura/altura (svh + safe-area) ficam consolidados
   numa única declaração mais abaixo, junto do resto do "responsive
   hardening" — aqui só as propriedades estruturais que não mudam por
   breakpoint. */
.frame {
  position:relative;
  margin:0 auto;
  background:#EDE1D3;
  overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 0 60px rgba(74,35,24,.18);
}
@media(min-width:600px){
  .frame{ border-radius:22px; box-shadow:0 20px 80px rgba(74,35,24,.22); border:1px solid rgba(74,35,24,.08); }
}

/* ─── TOP BAR — Cabeçalho claro que sustenta o título ───────────── */
.m-top {
  position:relative; z-index:6;
  padding:14px 16px 14px; flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#F8F1E4; /* Preenchimento claro */
  border-bottom:1px solid rgba(74,35,24,.14);
}
@media(min-width:600px){
  .m-top { border-radius:22px 22px 0 0; }
}
.m-brand {
  display:flex; align-items:center; gap:8px; min-width:0;
}
.m-brand-t {
  font-family:'Cormorant Garamond',serif; font-size:18px; letter-spacing:.05em; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  font-weight: 500;
}
.m-brand-t em{ color:var(--rose); font-style:italic; }
.m-top-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.m-icon-btn {
  width:34px; height:34px; min-width:34px; min-height:34px; border-radius:50%;
  background:transparent; border:1px solid transparent;
  color:var(--rose-dark); display:flex; align-items:center; justify-content:center;
  cursor:pointer; text-decoration:none; flex-shrink:0; transition: transform .2s, background .2s;
}
.m-icon-btn:hover { background:rgba(74,35,24,.07); }
.m-close {
  color:var(--text-muted); text-decoration:none; font-size:13px;
  letter-spacing:.14em; text-transform:uppercase;
}
.m-filters { display:flex; gap:6px; flex-wrap:wrap; }
.mf-pill {
  font-size:13px; letter-spacing:.14em; text-transform:uppercase; line-height:1.4;
  padding:7px 14px; border-radius:20px; cursor:pointer;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.75); font-family:'Jost',sans-serif; transition:background-color .3s,border-color .3s,color .3s,box-shadow .3s,scale .15s;
}
.mf-pill.on { background:var(--rose-dark); border-color:var(--rose-dark); color:#fff; }

/* ─── TELA DE CONFIGURAÇÃO (etapa 0) ────────────────────────────────────── */
.m-config {
  position:absolute; inset:0; z-index:8;
  display:flex; flex-direction:column;
  padding:clamp(1.5rem,7vw,2.2rem);
  background:linear-gradient(160deg, #F4EADB 0%, #EDE1D3 60%);
  overflow-x:hidden; overflow-y:auto;
}
.m-config::before {
  content:'';
  position:absolute;
  right:-10%;
  bottom:0;
  width:min(90%, 26rem);
  max-height:100%;
  aspect-ratio:500/976;
  background:url('webp/logo-match-background.webp') center/contain no-repeat;
  opacity:.08;
  pointer-events:none;
  z-index:0;
  filter:invert(1) brightness(.4);
}
.m-config.hidden{ display:none; }
@keyframes mConfigWipe {
  from { clip-path:inset(0 0 0 0); }
  to   { clip-path:inset(100% 0 0 0); }
}
.m-config.wiping { animation:mConfigWipe .55s var(--ease) forwards; pointer-events:none; }
/* Cabeçalho que sustenta o título "My Favorite Match" — preenchimento claro
   e harmônico com a paleta do Match (mesmo creme do fundo, com uma linha
   fina em --rose por baixo, no lugar do título solto sem apoio visual). */
.m-config-header {
  position:relative; z-index:2; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  margin:calc(-1 * clamp(1.5rem,7vw,2.2rem)) calc(-1 * clamp(1.5rem,7vw,2.2rem)) clamp(1.1rem,4.5vw,1.6rem);
  padding:16px clamp(2.6rem,10vw,3.2rem) 14px;
  background:#F8F1E4;
  border-bottom:1px solid rgba(74,35,24,.14);
}
@media(min-width:600px){
  .m-config-header { border-radius:22px 22px 0 0; }
}
.m-config-close {
  position:absolute; top:50%; right:16px; z-index:2; transform:translateY(-50%);
  color:var(--rose-dark); background:transparent; border-color:transparent;
}
.m-config-brand {
  position:relative; z-index:1; flex-shrink:0;
  text-align:center; font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.65rem,6.6vw,2.025rem); letter-spacing:.05em; color:var(--text);
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
}
.m-config-body {
  position:relative;
  z-index:1;
  display:flex; flex-direction:column; gap:clamp(1.1rem,5vw,1.6rem);
  margin-top:auto; margin-bottom:auto;
}
.m-config-brand em { color:var(--rose); font-style:italic; }
.m-config-title {
  font-family:'Cormorant Garamond',serif; color:var(--text);
  font-size:clamp(1.95rem,9.1vw,2.6rem); line-height:1.15; text-wrap:balance;
}
.m-config-title em{ color:var(--rose); font-style:italic; }
.m-config-sub { font-size:clamp(1rem,.95rem + .8vw,1.0625rem); color:var(--text-muted); line-height:1.5; }
.m-config-group{ display:flex; flex-direction:column; gap:.6rem; }
.m-config-label {
  font-size:.8125rem; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted); line-height:1.4;
}
.m-chip-row{ display:flex; flex-wrap:wrap; gap:.5rem; }
.m-chip {
  font-size:clamp(.8125rem,2.8vw,.9rem); padding:.55rem 1rem; border-radius:20px; cursor:pointer; line-height:1.4;
  background:rgba(74,35,24,.06); border:1px solid rgba(74,35,24,.18);
  color:var(--text); font-family:'Jost',sans-serif; transition:background-color .25s,border-color .25s,color .25s,box-shadow .25s,scale .15s;
}
.m-chip.on{ background:var(--rose-dark); border-color:var(--rose-dark); color:#fff; }
.m-config-start {
  margin-top:.4rem; width:100%; border:none; border-radius:12px; cursor:pointer;
  background:var(--rose-dark); color:#fff; font-family:'Jost',sans-serif; font-weight:600;
  letter-spacing:.08em; text-transform:uppercase; font-size:clamp(.8125rem,3vw,.9rem);
  padding:clamp(.85rem,3.6vw,1.05rem); min-height:48px;
}
.m-config-start:active{ transform:scale(.96); }
.m-config-nav {
  position:relative;
  z-index:1;
  display:flex; gap:.6rem; margin-top:auto; padding-top:1.4rem; flex-wrap:wrap; justify-content:center;
}
.m-config-navbtn {
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 18px; border-radius:999px; border:1.5px solid #B8896F;
  color:#24343C; font-family:'Cormorant Garamond',serif;
  font-size:14.3px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  text-decoration:none; background:#F6F1EC;
  opacity:.8;
  -webkit-tap-highlight-color:transparent; outline:none;
  transition:background .3s, box-shadow .3s, opacity .2s;
}
.m-config-navbtn:hover { background:#EADFD7; box-shadow:0 4px 14px rgba(36,52,60,.18); }
.m-config-navbtn:active,
.m-config-navbtn:focus { opacity:1; transition:opacity 0s; }

/* Versão clara do preenchimento do Bags — mesma paleta (marrom/terracota),
   só que num tom bem mais claro, em vez do marrom escuro sólido. */
a.brand-bags-fill-light {
  background:#EAD3C3;
  border-color:var(--brand-bags-brown);
  color:var(--brand-bags-brown);
  box-shadow:0 10px 24px rgba(101,60,43,.12);
}
a.brand-bags-fill-light svg { stroke:var(--brand-bags-brown); }
a.brand-bags-fill-light:hover {
  background:#F0DECE;
}
/* ─── CARD STACK (full-bleed) ───────────────────────────────────────────── */
.m-stage {
  position:relative; flex:1; overflow:hidden;
  background:var(--bg2);
}
.m-card {
  position:absolute; inset:0;
  display:flex; flex-direction:column; justify-content:flex-end;
  transition:transform .35s var(--ease), opacity .35s var(--ease);
  will-change:transform;
  overflow:hidden;
  touch-action:pan-y;
}
.m-card.dragging{ transition:none; }
.m-card.stack-1{ z-index:2; transform:scale(.96) translateY(10px); opacity:.85; }
.m-card.stack-2{ z-index:1; transform:scale(.92) translateY(20px); opacity:.6; }
.m-card.stack-top{ z-index:3; }

.m-swipe-badge{
  position:absolute; top:clamp(3.2rem,16vw,4rem); z-index:5;
  font-family:'Jost',sans-serif; font-weight:700; font-size:clamp(1.1rem,5.5vw,1.5rem);
  letter-spacing:.08em; text-transform:uppercase; padding:.4rem .9rem;
  border-radius:8px; border:3px solid; opacity:0; pointer-events:none;
  transform:rotate(-18deg);
}
.m-swipe-badge.like{ right:clamp(1rem,5vw,1.4rem); color:var(--green); border-color:var(--green); transform:rotate(-14deg); }
.m-swipe-badge.pass{ left:clamp(1rem,5vw,1.4rem); color:#C24E4E; border-color:#C24E4E; transform:rotate(14deg); }
.m-swipe-badge.super{ left:50%; top:clamp(1.6rem,8vw,2.2rem); transform:translateX(-50%) rotate(0); color:var(--blue); border-color:var(--blue); }

/* Segmented progress bar — estilo "stories" (preparado para múltiplas fotos) */
.m-progress {
  position:absolute; top:10px; left:10px; right:10px; z-index:3;
  display:flex; gap:4px;
}
.m-progress-seg {
  flex:1; height:3px; border-radius:3px;
  background:rgba(255,255,255,.32);
  overflow:hidden;
}
.m-progress-seg.filled span { width:100%; }
.m-progress-seg span {
  display:block; height:100%; width:0%;
  background:#fff; border-radius:3px;
}

.m-card-visual {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:var(--bg);
}
.m-card-visual img { width:100%; height:100%; object-fit:cover; }

/* Gradiente escuro subindo da base, estilo Tinder */
.m-card-scrim {
  position:absolute; left:0; right:0; bottom:0; height:58%;
  background:linear-gradient(to top, rgba(10,6,4,.92) 0%, rgba(10,6,4,.55) 42%, transparent 100%);
  pointer-events:none; z-index:1;
}

.m-card-info {
  position:relative; z-index:2; padding:0 20px 26px;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.m-card-info-main { min-width:0; }
.m-card-brand {
  display:inline-block; font-size:13px; letter-spacing:.16em; text-transform:uppercase; line-height:1.4;
  padding:4px 10px; border-radius:20px; margin-bottom:9px;
  background:rgba(255,255,255,.14); color:#fff;
}
.m-card-name-row{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.m-card-name { font-family:'Cormorant Garamond',serif; font-size:27px; line-height:1.15; color:#fff; overflow-wrap:break-word; }
.m-authentic{
  flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:18px; border-radius:50%; background:rgba(182,139,115,.25);
  color:var(--rose); border:1px solid var(--rose);
}
.m-authentic svg{ display:block; }
.m-card-cat { font-size:13px; letter-spacing:.16em; text-transform:uppercase; line-height:1.4; color:rgba(255,255,255,.78); }

.m-info-btn {
  flex-shrink:0; width:clamp(2.05rem, 8vw, 2.35rem); height:clamp(2.05rem, 8vw, 2.35rem); min-width:34px; min-height:34px; border-radius:50%;
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.28);
  color:#fff; font-family:'Cormorant Garamond',serif; font-size:clamp(.95rem, 4vw, 1.1rem); font-style:italic;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

/* Selo Novidade */
.m-badge-new{
  position:absolute; top:clamp(3.4rem,15vw,4.1rem); left:clamp(.8rem,3.6vw,1.05rem); z-index:3;
  background:rgba(145,94,72,.82); color:#fff; font-size:13px; letter-spacing:.14em; text-transform:uppercase; line-height:1.4;
  padding:5px 10px; border-radius:20px; font-weight:600;
}

/* ─── PAINEL DE INFORMAÇÃO (bottom sheet) ───────────────────────────────── */
.m-info-sheet{
  position:absolute; left:0; right:0; bottom:0; z-index:7;
  background:#F4EADB; border-radius:20px 20px 0 0; border-top:1px solid rgba(74,35,24,.12);
  padding:clamp(1rem,4.5vw,1.4rem) clamp(1.1rem,4.5vw,1.4rem) clamp(1.4rem,5vw,1.8rem);
  transform:translateY(100%); transition:transform .32s var(--ease);
  max-height:60%; overflow-y:auto;
  box-shadow:0 -8px 30px rgba(74,35,24,.14);
}
.m-info-sheet.open{ transform:translateY(0); }
.m-info-sheet-handle{
  width:36px; height:4px; border-radius:4px; background:rgba(74,35,24,.22); margin:0 auto 14px;
}
.m-info-sheet-close{
  position:absolute; top:12px; right:14px; width:30px; height:30px; border-radius:50%;
  background:rgba(74,35,24,.06); border:1px solid rgba(74,35,24,.16); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.m-info-sheet-cat{ font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--rose-dark); margin-bottom:8px; line-height:1.4; }
.m-info-sheet-desc{ font-size:clamp(1rem,.95rem + .5vw,1.0625rem); color:var(--text); line-height:1.55; margin-bottom:14px; }
.m-info-tags{ display:flex; flex-wrap:wrap; gap:8px; }
.m-info-tag{
  font-size:13px; letter-spacing:.05em; padding:6px 12px; border-radius:20px; line-height:1.4;
  border:1px solid var(--rose); color:var(--rose); background:transparent;
}
.m-info-backdrop{
  position:absolute; inset:0; z-index:6; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .3s;
}
.m-info-backdrop.open{ opacity:1; pointer-events:auto; }

.m-card.leaving-left  { transform:translateX(-140%) rotate(-12deg); opacity:0; }
.m-card.leaving-right { transform:translateX(140%) rotate(12deg); opacity:0; }

.m-empty {
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; text-align:center; padding:0 30px; color:var(--text-muted);
}
.m-empty-t { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--text); }
.m-empty-actions{ margin-top:6px; display:flex; flex-direction:column; gap:.65rem; width:100%; max-width:280px; }
.m-empty-btn{
  border:1.5px solid var(--rose); background:transparent; color:var(--text);
  border-radius:10px; padding:.8rem 1.6rem; font-family:'Jost',sans-serif; font-size:.85rem; line-height:1.4;
  letter-spacing:.1em; text-transform:uppercase; cursor:pointer; min-height:44px;
  text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
}
.m-empty-btn-wa{ background:#25D366; border-color:#25D366; color:#0b3d20; font-weight:600; }

/* ─── ACTION BUTTONS — estilo Tinder, skin My Favorite ──────────────────── */
.m-actions {
  flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:14px;
  padding:8px 10px 24px;
  background:var(--bg);
}
.m-abtn {
  border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:transform .2s var(--ease), box-shadow .2s var(--ease);
  background:rgba(74,35,24,.05);
  color:var(--text);
}
.m-abtn:active{ transform:scale(.96); }
.m-abtn svg { display:block; }

.m-undo  { width:46px; height:46px; border:1.5px solid var(--orange); color:var(--orange); }
.m-pass  { width:58px; height:58px; border:1.5px solid #C24E4E; color:#C24E4E; }
.m-super { width:46px; height:46px; border:1.5px solid var(--blue); color:var(--blue); }
.m-like  { width:64px; height:64px; border:1.5px solid var(--green); color:var(--green); box-shadow:0 6px 22px rgba(46,158,107,.28); }

.m-abtn:disabled { opacity:.35; cursor:not-allowed; }

/* ─── MATCH OVERLAY ──────────────────────────────────────────────────── */
.m-ov {
  position:absolute; inset:0; z-index:10; display:none;
  align-items:center; justify-content:center;
  background:rgba(237,225,211,.97); backdrop-filter:blur(4px);
  padding:30px;
}
.m-ov.open{ display:flex; }
.m-ov-card { position:relative; text-align:center; width:100%; animation:mOvIn .5s var(--ease); }
.m-ov-close {
  position:absolute; top:-6px; right:-6px; width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(74,35,24,.06); border:1px solid rgba(74,35,24,.18);
  border-radius:50%; color:var(--text); cursor:pointer; font-size:16px; line-height:1;
  transition:background .3s;
}
.m-ov-close:hover { background:rgba(74,35,24,.14); }
@keyframes mOvIn{
  0%{ transform:scale(.7); opacity:0; }
  60%{ transform:scale(1.04); opacity:1; }
  100%{ transform:scale(1); opacity:1; }
}
.m-ov-emoji{ font-size:44px; margin-bottom:10px; animation:mOvPulse 1.1s ease-in-out .4s 2; }
@keyframes mOvPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.18); }
}
.m-ov-t { font-family:'Cormorant Garamond',serif; font-size:26px; color:var(--text); margin-bottom:6px; line-height:1.2; }
.m-ov-s { font-size:13px; color:var(--text-muted); margin-bottom:22px; line-height:1.6; }
.m-ov-msg{
  width:100%; resize:vertical; min-height:56px; max-height:110px; margin-bottom:14px;
  background:#fff; border:1px solid rgba(74,35,24,.2); border-radius:10px;

/* ─── TUTORIAL (coach marks) ──────────────────────────────────────────────── */
.m-tut { position:absolute; inset:0; z-index:9; display:none; cursor:pointer; }
.m-tut.open { display:block; }
.m-tut-backdrop {
  position:absolute; inset:0;
  background:rgba(10,6,4,.62);
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.m-tut-target-glow {
  position:relative; z-index:11 !important;
  box-shadow:0 0 0 4px var(--rose), 0 0 22px 4px rgba(201,138,94,.65) !important;
  border-radius:50%;
  transition:box-shadow .2s;
}
.m-tut-cluster {
  position:absolute; z-index:10; display:flex; flex-direction:column;
  align-items:center; gap:8px; pointer-events:none;
}
.m-tut-cluster.point-mode { flex-direction:column-reverse; gap:6px; }
.m-tut-clone { position:absolute; z-index:11; pointer-events:none; }
.m-tut-text {
  font-family:'Cormorant Garamond',serif; font-weight:400; font-style:italic;
  color:#fff; font-size:clamp(1.05rem,4.4vw,1.3rem); line-height:1.3;
  text-align:center; max-width:230px; text-wrap:balance;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.m-tut-text b { font-style:normal; font-weight:600; color:var(--rose); }
.m-tut-hand-wrap { width:41px; height:124px; position:relative; }
.m-tut-hand {
  position:absolute; left:50%; top:50%; width:41px;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
}
.m-tut-hand img { display:block; width:100%; height:auto; pointer-events:none; }
.m-tut-hand.swipe-right { animation:tutSwipeRight 1.4s ease-in-out infinite; }
.m-tut-hand.swipe-left  { animation:tutSwipeLeft 1.4s ease-in-out infinite; }
.m-tut-hand.swipe-up    { animation:tutSwipeUp 1.4s ease-in-out infinite; }
.m-tut-hand.point-above { animation:tutPointPulseDown 1.2s ease-in-out infinite; }
.m-tut-hand.point-below { animation:tutPointPulseUp 1.2s ease-in-out infinite; }
@keyframes tutSwipeRight {
  0%   { transform:translate(calc(-50% - 14px),-50%) scaleY(-1) rotate(90deg); opacity:0; }
  20%  { opacity:1; }
  80%  { opacity:1; }
  100% { transform:translate(calc(-50% + 14px),-50%) scaleY(-1) rotate(90deg); opacity:0; }
}
@keyframes tutSwipeLeft {
  0%   { transform:translate(calc(-50% + 14px),-50%) rotate(-90deg); opacity:0; }
  20%  { opacity:1; }
  80%  { opacity:1; }
  100% { transform:translate(calc(-50% - 14px),-50%) rotate(-90deg); opacity:0; }
}
@keyframes tutSwipeUp {
  0%   { transform:translate(-50%, calc(-50% + 14px)) rotate(0deg); opacity:0; }
  20%  { opacity:1; }
  80%  { opacity:1; }
  100% { transform:translate(-50%, calc(-50% - 14px)) rotate(0deg); opacity:0; }
}
@keyframes tutPointPulseDown {
  0%,100% { transform:translate(-50%,-50%) rotate(180deg) scaleX(-1); }
  50%     { transform:translate(-50%, calc(-50% + 8px)) rotate(180deg) scaleX(-1); }
}
@keyframes tutPointPulseUp {
  0%,100% { transform:translate(-50%,-50%) rotate(0deg); }
  50%     { transform:translate(-50%, calc(-50% - 8px)) rotate(0deg); }
}
.m-tut-skip {
  position:absolute; right:20px; top:58%; z-index:10;
  background:transparent; border:none; color:rgba(255,255,255,.65);
  font-family:'Jost',sans-serif; font-size:.8125rem; letter-spacing:.04em; cursor:pointer;
  text-decoration:underline; padding:.5rem;
}

}
.m-fs-cluster {

}
.m-fs-text {

  color:#fff; font-size:clamp(1.1rem,4.6vw,1.4rem); line-height:1.3;

}
.m-fs-arrow {
 width:34px;
 transform:translateX(60px);
}
.m-fs-arrow img { display:block; width:100%; height:auto; pointer-events:none; }
.m-fs-icon-btn {
  background:none; border:none; padding:0; cursor:pointer;
  width:64px; height:64px;
  animation:fsBreathe 1.8s ease-in-out infinite;
}
.m-fs-icon-btn img { display:block; width:100%; height:100%; pointer-events:none; }
@keyframes fsFloat {
  0%,100% { transform:translate(-50%,-50%) translateY(0); }
  50%     { transform:translate(-50%,-50%) translateY(-10px); }
}
@keyframes fsBreathe {
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.12); }
}

<body class="page-match">

<div id="pageCurtain" class="page-curtain"><div class="page-curtain-bg"></div><img class="page-curtain-logo" alt="" style="display:none;"></div>
<script>
(function(){
  try {
    var raw = sessionStorage.getItem('mfb_curtain_in');
    var data;
    if (raw) {
      sessionStorage.removeItem('mfb_curtain_in');
      data = JSON.parse(raw);
    } else {
      // Acesso direto pelo link (sem vir de outra página do trio por
      // clique) — toca a mesma animação de entrada, com a logo desta
      // própria página, reaproveitando os mesmos tempos de sempre.
      data = { logo: 'webp/logo-my-favorite-match-mini.webp', logoClass: 'is-match-logo' };
    }
    var el = document.getElementById('pageCurtain');
    if (!el) return;
    // Transição por fade: a cortina (tom pérola, via CSS) já nasce coberta
    // (is-closed) — a logo do site novo fica pronta, em opacidade 0;
    // js/page-transition.js (playEntrance) funde ela pra dentro, segura
    // um instante, e funde tudo de volta revelando a página.
    var logoEl = el.querySelector('.page-curtain-logo');
    if (logoEl) {
      if (data.logo) { logoEl.src = data.logo; logoEl.style.display = 'block'; }
      else { logoEl.style.display = 'none'; }
      if (data.logoClass) { logoEl.classList.add(data.logoClass); }
      logoEl.style.transition = 'none';
      logoEl.style.opacity = '0';
    }
    el.classList.add('is-closed');
  } catch (e) {}
})();
</script>

  <div class="m-tut" id="mTut">
    <div class="m-tut-backdrop" onclick="nextTutorialStep()"></div>
    <div class="m-tut-cluster" id="mTutCluster">

      <div class="m-tut-hand-wrap" id="mTutHandWrap">

          <img src="img/hand_tutorial.png" alt="" draggable="false">
        </div>

  </div>

    <div class="m-ov-card">
      <button class="m-ov-close" onclick="closeMatchOverlay()" aria-label="Fechar">✕</button>
      <div class="m-ov-emoji">💛</div>

      <p class="m-ov-s" id="mOvSub">Você já curtiu <b id="mOvCount">1</b> peça(s).</p>
      <div class="m-ov-list" id="mOvList"></div>
      <textarea class="m-ov-msg" id="mOvMsg" placeholder="Quer adicionar algo à mensagem? (opcional)"></textarea>

    </div>
  </div>
</div>

<script src="data/products-bags.js"></script>
<script src="data/products-looks.js"></script>
<script src="js/supabase-client.js"></script>
<script>
// ─── DADOS ──────────────────────────────────────────────────────────────────
// Fonte única compartilhada com index.html (Bags) e looks.html (Looks).
// Editar um produto em qualquer catálogo reflete aqui automaticamente,
// pois todas as páginas leem os mesmos arrays window.MFB_BAGS / window.MFB_LOOKS.
// Segmentação leve de "ocasião" para itens que ainda não têm o campo explícito nos dados.
function inferOccasion(p, brand) {
  if (p.occasion) return p.occasion;
  if (brand === 'bags') {
    if (p.cat === 'clutch') return 'ocasiao-especial';
    const priceNum = parseInt(String(p.price).replace(/\D/g,''), 10) || 0;
    if (priceNum >= 450) return 'ocasiao-especial';
    return 'dia-a-dia';
  }
  return 'dia-a-dia';
}
function buildBagsItems() {
  return (window.MFB_BAGS  || []).filter(p => p.status !== 'hidden').map(p => ({
    name:p.name, cat:'Bolsa', catLabel: {tote:'Tote Bag',shoulder:'Shoulder',clutch:'Clutch',mini:'Mini Bag'}[p.cat] || p.cat,
    price:p.price, status:p.status || 'available', brand:'bags', img:p.img,
    isNew: !!p.isNew, tags: Array.isArray(p.tags) ? p.tags : [], occasion: inferOccasion(p,'bags'),
  }));
}
function buildLooksItems() {
  return (window.MFB_LOOKS || []).filter(p => p.status !== 'hidden').map(p => ({
    name:p.name, catLabel: {colar:'Colar',brinco:'Brinco',pulseira:'Pulseira',anel:'Anel'}[p.cat] || p.cat,
    cat: {colar:'Colar',brinco:'Brinco',pulseira:'Pulseira',anel:'Anel'}[p.cat] || p.cat,
    price:p.price, status:p.status || 'available', brand:'looks', img:p.img,
    isNew: !!p.isNew, tags: Array.isArray(p.tags) ? p.tags : [], occasion: inferOccasion(p,'looks'),
  }));
}
let BAGS_ITEMS  = buildBagsItems();
let LOOKS_ITEMS = buildLooksItems();
let ALL_ITEMS = [...BAGS_ITEMS, ...LOOKS_ITEMS].map((it,i)=>({ ...it, id:i }));

// Busca os dados atuais no banco (Supabase) assim que a página abre, pra não
// ficar mostrando bolsas/peças antigas que já foram removidas/editadas no
// admin. Se o banco falhar, continua usando os dados locais (fallback).
async function refreshMatchItemsFromDB() {
  if (window.MFB_USE_REMOTE_CATALOG === false) return;
  try {
    const [dbBags, dbLooks] = await Promise.all([sbFetchBags(), sbFetchLooks()]);
    if (dbBags && dbBags.length) window.MFB_BAGS = dbBags;
    if (dbLooks && dbLooks.length) window.MFB_LOOKS = dbLooks;
    BAGS_ITEMS  = buildBagsItems();
    LOOKS_ITEMS = buildLooksItems();
    ALL_ITEMS = [...BAGS_ITEMS, ...LOOKS_ITEMS].map((it,i)=>({ ...it, id:i }));
  } catch (e) {
    console.warn('Não foi possível atualizar itens do Match a partir do banco, usando dados locais.', e);
  }
}
refreshMatchItemsFromDB();

const BRAND_LABEL = { bags:'My Favorite Bags', looks:'My Favorite Looks' };
const STATUS_LABEL_PT = { available:'Disponível', sold_out:'Esgotado', coming_soon:'Em Breve' };
const WA_NUMBER = '5581995966968';

// ─── ANALYTICS (Match Analytics, painel admin) ──────────────────────────────
// Tracking 100% anônimo — nenhum dado pessoal, só IDs gerados no navegador.
// `visitor_id` persiste no localStorage (mesma pessoa entre visitas);
// `session_id` é novo a cada carregamento da página. Usados pra alimentar o
// painel "Match Analytics" do admin (acessos, conclusões de baralho, matches
// por dia/semana/mês/ano, por usuário e por peça).
function _mfbUuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}
function _mfbMatchVisitorId() {
  try {
    let id = localStorage.getItem('mfb_match_visitor_id');
    if (!id) { id = _mfbUuid(); localStorage.setItem('mfb_match_visitor_id', id); }
    return id;
  } catch (_) { return _mfbUuid(); }
}
const MATCH_VISITOR_ID = _mfbMatchVisitorId();
const MATCH_SESSION_ID = _mfbUuid();
function trackMatchEvent(eventType, extra) {
  if (typeof sbTrackMatchEvent !== 'function') return;
  sbTrackMatchEvent(eventType, { visitor_id: MATCH_VISITOR_ID, session_id: MATCH_SESSION_ID, ...(extra || {}) });
}
// Uma visita = um carregamento da página (não exige ter começado a "jogar").
trackMatchEvent('page_view');

// Ícones SVG genéricos (fallback para itens sem foto — ex.: Looks)
function placeholderSVG(cat) {
  const c = '#B68B73';
  const map = {
    'Colar':    `<svg viewBox="0 0 200 220" width="46%" fill="none"><path d="M40 60Q100 130 160 60" stroke="${c}" stroke-width="2.4" fill="none"/><circle cx="100" cy="128" r="12" stroke="${c}" stroke-width="2.2" fill="none"/></svg>`,
    'Brinco':   `<svg viewBox="0 0 200 220" width="46%" fill="none"><circle cx="100" cy="60" r="9" stroke="${c}" stroke-width="2.2" fill="none"/><path d="M78 100Q100 150 122 100" stroke="${c}" stroke-width="2.2" fill="none"/></svg>`,
    'Pulseira': `<svg viewBox="0 0 200 220" width="46%" fill="none"><ellipse cx="100" cy="110" rx="70" ry="34" stroke="${c}" stroke-width="2.4" fill="none"/></svg>`,
    'Anel':     `<svg viewBox="0 0 200 220" width="46%" fill="none"><circle cx="100" cy="130" r="42" stroke="${c}" stroke-width="2.6" fill="none"/><path d="M82 92L100 64L118 92Z" stroke="${c}" stroke-width="2.2" fill="none"/></svg>`,
  };
  return map[cat] || map['Colar'];
}

// ─── STATE ─────────────────────────────────────────────────────────────────
let filter = (function(){ try { return localStorage.getItem('mfb_match_default_filter'); } catch (_) { return null; } })() || 'all';
let occasion = 'all';
let queue = [];
let likes = [];
let history = []; // pilha de decisões para permitir "desfazer"
let started = false;
let infoOpen = false;

// Antes de mostrar a tela final (fim do baralho), o app reembaralha e
// mostra o catálogo inteiro de novo automaticamente, por até 2 vezes (2
// embaralhos diferentes), sem pedir nada ao usuário — só depois disso é
// que a tela final aparece de fato.
const AUTO_RESHUFFLE_PASSES = 2;
let autoPassesRemaining = 0;
let lastSwipedItem = null; // último card decidido — usado pra evitar repetir

function filteredItems() {
  let list = ALL_ITEMS;
  if (filter === 'bags') list = list.filter(i => i.brand === 'bags');
  else if (filter === 'looks') list = list.filter(i => i.brand === 'looks');
  if (occasion !== 'all') list = list.filter(i => i.occasion === occasion);
  return list;
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('#mFilters .m-chip').forEach(b => {
    const selected = b.dataset.f === f;
    b.classList.toggle('on', selected);
    b.setAttribute('aria-pressed', String(selected));
  });
}
function setOccasion(o) {
  occasion = o;
  document.querySelectorAll('#mOccasions .m-chip').forEach(b => {
    const selected = b.dataset.o === o;
    b.classList.toggle('on', selected);
    b.setAttribute('aria-pressed', String(selected));
  });
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Embaralha evitando que o primeiro item do resultado seja o mesmo
// `avoidItem` (normalmente o último card visto no embaralho anterior) —
// assim a "costura" entre um embaralho automático e o próximo nunca repete
// a mesma peça em sequência.
function shuffleAvoidingFirst(list, avoidItem) {
  const shuffled = shuffle(list.slice());
  if (avoidItem && shuffled.length > 1 && shuffled[0].id === avoidItem.id) {
    [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
  }
  return shuffled;
}

function updateUndoBtn() {
  const btn = document.getElementById('btnUndo');
  if (btn) btn.disabled = history.length === 0;
}

// ─── ETAPA 0: TELA DE CONFIGURAÇÃO ──────────────────────────────────────────
function openConfig() {
  document.getElementById('mConfig').classList.remove('hidden');
  document.getElementById('mTop').style.display = 'none';
  document.getElementById('mStage').style.display = 'none';
  document.getElementById('mActions').style.display = 'none';
}

function startSwiping() {
  let list = filteredItems();
  if (!list.length) list = ALL_ITEMS.slice(); // fallback: evita ficar vazio se combinação não bate com nada
  queue = shuffle(list.slice());
  history = [];
  autoPassesRemaining = AUTO_RESHUFFLE_PASSES;
  lastSwipedItem = null;
  started = true;
  updateUndoBtn();
  // Monta o baralho ATRÁS da tela de configuração ANTES de começar a "remover"
  // ela — assim, quando a animação revela o que tem por trás, já é o card
  // carregado, e não o fundo escuro vazio do frame.
  document.getElementById('mTop').style.display = 'flex';
  document.getElementById('mStage').style.display = 'block';
  document.getElementById('mActions').style.display = 'flex';
  render();
  // Se a tela ainda não está em tela cheia, monta a telinha pedindo pra
  // ativar o modo tela cheia JÁ ATRÁS da tela de configuração (mesma lógica
  // do card, acima) — assim, quando a config for "removida", ela revela
  // direto essa tela na frente do card, sem o card aparecer sozinho antes.
  const needsFsPrompt = !isFullscreenActive();
  if (needsFsPrompt) document.getElementById('mFs').classList.add('open');
  const cfg = document.getElementById('mConfig');
  cfg.classList.add('wiping');
  setTimeout(() => {
    cfg.classList.remove('wiping');
    cfg.classList.add('hidden');
    // Se já estava em tela cheia, pula direto pro tutorial. Senão, a telinha
    // de tela cheia (já revelada acima) segue na tela até o usuário tocar
    // no ícone (confirmFullscreenPrompt fecha ela e chama startTutorial).
    if (!needsFsPrompt) startTutorial();
  }, 550);
}

// ─── TELA "ATIVAR TELA CHEIA" ────────────────────────────────────────────────
function isFullscreenActive() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function confirmFullscreenPrompt() {
  const finish = () => {
    document.getElementById('mFs').classList.remove('open');
    startTutorial();
  };
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) {
    req.call(el).then(finish).catch(finish);
  } else {
    finish();
  }
}

// ─── TUTORIAL (coach marks) ─────────────────────────────────────────────────
const TUTORIAL_STEPS = [
  { type:'swipe-right', text:'Arraste o card para a <b>direita</b> para curtir uma peça.' },
  { type:'swipe-left',  text:'Arraste para a <b>esquerda</b> para passar para a próxima.' },
  { type:'swipe-up',    text:'Arraste para <b>cima</b> para favoritar uma peça que você amou.' },
  { type:'point', handSide:'above', target:'#btnUndo', text:'Toque aqui para <b>voltar</b> e desfazer a última escolha.' },
  { type:'point', handSide:'below', target:'#mTop button.m-icon-btn', text:'Toque aqui para abrir as <b>configurações</b> e trocar o filtro.', offsetY:8, handOffsetX:15, handOffsetY:6 },
  { type:'point', handSide:'below', target:'#mTop a.m-icon-btn', text:'Toque aqui para <b>sair</b> do My Favorite Match.', offsetY:8, handOffsetX:55, handOffsetY:6 },
];
let tutStep = 0;
let tutCloneEl = null;

function startTutorial() {
  tutStep = 0;
  document.getElementById('mTut').classList.add('open');
  renderTutorialStep();
}

function renderTutorialStep() {
  clearTutorialHighlight();
  const step = TUTORIAL_STEPS[tutStep];
  const hand = document.getElementById('mTutHand');
  const textEl = document.getElementById('mTutText');
  const cluster = document.getElementById('mTutCluster');

  textEl.innerHTML = step.text;
  hand.className = 'm-tut-hand';
  cluster.classList.remove('point-mode');
  cluster.style.top = '';
  cluster.style.bottom = '';
  cluster.style.left = '';
  cluster.style.transform = '';
  document.getElementById('mTutHandWrap').style.transform = '';

  const frame = document.querySelector('.frame');
  const frameR = frame.getBoundingClientRect();

  if (step.type === 'point') {
    const target = document.querySelector(step.target);
    if (target) {
      const r = target.getBoundingClientRect();
      const offsetX = step.offsetX || 0;
      const offsetY = step.offsetY || 0;
      const rawX = r.left - frameR.left + r.width / 2 + offsetX;
      const clampedX = Math.min(Math.max(rawX, 95), frameR.width - 95);
      cluster.style.left = clampedX + 'px';
      cluster.style.transform = 'translateX(-50%)';

      if (step.handSide === 'below') {
        // Clona o botão real e o desenha por cima do blur, na posição exata,
        // para que ele fique nítido enquanto o resto da tela permanece desfocado.
        const clone = target.cloneNode(true);
        clone.removeAttribute('id');
        clone.classList.add('m-tut-clone', 'm-tut-target-glow');
        clone.style.left = (r.left - frameR.left) + 'px';
        clone.style.top = (r.top - frameR.top) + 'px';
        clone.style.width = r.width + 'px';
        clone.style.height = r.height + 'px';
        clone.style.margin = '0';
        document.getElementById('mTut').appendChild(clone);
        tutCloneEl = clone;

        cluster.classList.add('point-mode');
        cluster.style.top = (r.bottom - frameR.top + 2 + offsetY) + 'px';
        hand.classList.add('point-below');
        if (step.handOffsetX || step.handOffsetY) {
          const hx = step.handOffsetX || 0;
          const hy = step.handOffsetY || 0;
          document.getElementById('mTutHandWrap').style.transform = `translate(${hx}px, ${hy}px)`;
        }
      } else {
        target.classList.add('m-tut-target-glow');
        target.style.pointerEvents = 'none';
        cluster.style.bottom = (frameR.height - (r.top - frameR.top) + 14) + 'px';
        hand.classList.add('point-above');
      }
    }
  } else {
    cluster.style.left = '50%';
    cluster.style.top = '36%';
    cluster.style.transform = 'translate(-50%,-50%)';
    hand.classList.add(step.type);
  }
}

function nextTutorialStep() {
  tutStep++;
  if (tutStep >= TUTORIAL_STEPS.length) { skipTutorial(); return; }
  renderTutorialStep();
}

function skipTutorial() {
  clearTutorialHighlight();
  document.getElementById('mTut').classList.remove('open');
}

function clearTutorialHighlight() {
  document.querySelectorAll('.m-tut-target-glow').forEach(el => {
    el.classList.remove('m-tut-target-glow');
    el.style.pointerEvents = '';
  });
  if (tutCloneEl) { tutCloneEl.remove(); tutCloneEl = null; }
}

// ─── FEEDBACK SENSORIAL ─────────────────────────────────────────────────────
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}
let _audioCtx = null;
function playMatchSound() {
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    const t0 = ctx.currentTime;
    [0, .12].forEach((delay, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 0 ? 660 : 880;
      gain.gain.setValueAtTime(0.0001, t0 + delay);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0 + delay);
      osc.stop(t0 + delay + 0.28);
    });
  } catch(e) {}
}

// ─── RENDER (com profundidade de pilha) ─────────────────────────────────────
function cardHTML(it, cls) {
  const authenticSVG = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  return `
    <div class="m-card ${cls}" data-id="${it.id}">
      ${it.isNew ? `<div class="m-badge-new">Novidade</div>` : ''}
      ${(it.images && it.images.length > 1) ? `
      <div class="m-progress">
        ${it.images.map((img, i) => `<div class="m-progress-seg ${i === 0 ? 'filled' : ''}"><span></span></div>`).join('')}
      </div>` : ''}
      <div class="m-swipe-badge like">Curtir</div>
      <div class="m-swipe-badge pass">Passar</div>
      <div class="m-swipe-badge super">Favorito</div>
      <div class="m-card-visual">
        ${it.img ? `<img src="${it.img}" alt="${it.name}" draggable="false">` : placeholderSVG(it.cat)}
      </div>
      <div class="m-card-scrim"></div>
      <div class="m-card-info">
        <div class="m-card-info-main">
          <span class="m-card-brand">${BRAND_LABEL[it.brand]}</span>
          <div class="m-card-name-row">
            <div class="m-card-name">${it.name}</div>
            <span class="m-authentic" title="Peça Original My Favorite">${authenticSVG}</span>
          </div>
          <div class="m-card-cat">${it.catLabel || it.cat}</div>
        </div>
        <div class="m-info-btn" onclick="openInfo(${it.id})" aria-label="Mais informações">i</div>
      </div>
    </div>`;
}

// Link do WhatsApp mostrado ao final do baralho — leva em conta se a pessoa
// já curtiu alguma peça (pra personalizar a mensagem) ou não.
function emptyStateWaLink() {
  const msg = likes.length
    ? `Olá! Vi todo o catálogo no My Favorite Match e curti ${likes.length} peça${likes.length !== 1 ? 's' : ''}. Queria saber mais!`
    : 'Olá! Vi todo o catálogo no My Favorite Match e queria saber mais sobre as peças.';
  return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function render() {
  const stage = document.getElementById('mStage');
  if (!queue.length) {
    // Antes de encerrar de vez, refaz o baralho embaralhado automaticamente
    // (até 2 vezes, embaralhos diferentes a cada passagem), sem pedir nada
    // ao usuário — a "costura" evita repetir o último card visto como
    // primeiro do próximo embaralho.
    if (autoPassesRemaining > 0) {
      autoPassesRemaining--;
      let list = filteredItems();
      if (!list.length) list = ALL_ITEMS.slice();
      queue = shuffleAvoidingFirst(list, lastSwipedItem);
      render();
      return;
    }
    // Fim de verdade: registra que essa pessoa chegou até o último card
    // (métrica "baralhos concluídos" / "pessoas que viram tudo" no admin).
    trackMatchEvent('session_complete');
    // Se rolou algum match na sessão, mostra o resumo (mesma tela de "Deu
    // match!", com o título trocado e o botão de continuar virando
    // "Embaralhar e tentar de novo"). Sem nenhum match, mostra a tela de
    // "viu tudo" com o convite pro WhatsApp.
    if (likes.length > 0) {
      openMatchOverlay({ final: true });
      return;
    }
    stage.innerHTML = `<div class="m-empty">
      <div class="m-empty-t">Você viu tudo por aqui ✨</div>
      <div class="m-empty-actions">
        <a class="m-empty-btn m-empty-btn-wa" href="${emptyStateWaLink()}" target="_blank" rel="noopener">Falar no WhatsApp</a>
        <button class="m-empty-btn" onclick="restartLoop()">Reembaralhar e ver de novo</button>
      </div>
    </div>`;
    clearTimeout(window._loopTimer);
    return;
  }
  const visible = queue.slice(0, 3);
  stage.innerHTML = visible.map((it, idx) => {
    const cls = idx === 0 ? 'stack-top' : (idx === 1 ? 'stack-1' : 'stack-2');
    return cardHTML(it, cls);
  }).reverse().join('');
  const topCard = stage.querySelector('.stack-top');
  if (topCard) attachDrag(topCard);
}

// ─── REINICIAR (botão "Reembaralhar e ver de novo" / "Embaralhar e tentar
// de novo") ───────────────────────────────────────────────────────────────
// Reembaralha o catálogo do zero, zera os matches da sessão e volta a
// mostrar o mesmo ciclo automático (baralho + até 2 reembaralhos antes da
// tela final).
function restartLoop() {
  clearTimeout(window._loopTimer);
  closeMatchOverlay();
  likes = [];
  history = [];
  updateUndoBtn();
  lastSwipedItem = null;
  autoPassesRemaining = AUTO_RESHUFFLE_PASSES;
  let list = filteredItems();
  if (!list.length) list = ALL_ITEMS.slice();
  queue = shuffle(list.slice());
  render();
}

// ─── DECISÃO (clique nos botões OU gesto) ───────────────────────────────────
function decide(action) {
  if (action === 'undo') {
    if (!history.length) return;
    const last = history.pop();
    if (last.action === 'like' || last.action === 'super') {
      likes = likes.filter(l => l.id !== last.item.id);
    }
    queue.unshift(last.item);
    updateUndoBtn();
    render();
    return;
  }

  if (!queue.length) return;
  const it = queue[0];
  const card = document.querySelector('.m-card.stack-top');
  const isLike = action === 'like' || action === 'super';
  if (card) {
    card.style.transition = 'transform .35s var(--ease), opacity .35s var(--ease)';
    if (action === 'super') card.style.transform = 'translateY(-140%) rotate(0deg)';
    else card.classList.add(isLike ? 'leaving-right' : 'leaving-left');
  }
  vibrate(isLike ? [20, 30, 20] : 15);

  setTimeout(() => {
    queue.shift();
    history.push({ action, item: it });
    updateUndoBtn();
    lastSwipedItem = it;
    if (isLike) {
      likes.push({ ...it, superLiked: action === 'super' });
      trackMatchEvent('match', { item_id: String(it.id), item_name: it.name, item_brand: it.brand });
    }

    // Só é "o fim de verdade" se a fila zerou e não sobra nenhum
    // reembaralhamento automático — nesse caso, quem decide qual overlay
    // final mostrar é o próprio render() (evita abrir o popup normal de
    // "Deu match!" por cima do resumo final).
    const reachedTrueEnd = !queue.length && autoPassesRemaining === 0;
    render();
    if (isLike && !(reachedTrueEnd && likes.length)) {
      openMatchOverlay();
    }
  }, 260);
}

// ─── DRAG / SWIPE NATIVO (mouse + touch) ────────────────────────────────────
function attachDrag(card) {
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, wasDrag = false;
  const threshold = 100;
  const tapThreshold = 6;
  const likeBadge = card.querySelector('.m-swipe-badge.like');
  const passBadge = card.querySelector('.m-swipe-badge.pass');
  const superBadge = card.querySelector('.m-swipe-badge.super');

  function onDown(x, y) {
    dragging = true; wasDrag = false; startX = x; startY = y; dx = 0; dy = 0;
    card.classList.add('dragging');
  }
  function onMove(x, y) {
    if (!dragging) return;
    dx = x - startX; dy = y - startY;
    if (Math.abs(dx) > tapThreshold || Math.abs(dy) > tapThreshold) wasDrag = true;
    const rot = Math.max(-15, Math.min(15, dx / 20));
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    const distX = Math.min(Math.abs(dx) / threshold, 1);
    const distY = Math.min(Math.abs(dy) / threshold, 1);
    if (dy < -20 && Math.abs(dy) > Math.abs(dx)) {
      superBadge.style.opacity = distY;
      likeBadge.style.opacity = 0; passBadge.style.opacity = 0;
    } else if (dx > 0) {
      likeBadge.style.opacity = distX; passBadge.style.opacity = 0; superBadge.style.opacity = 0;
    } else if (dx < 0) {
      passBadge.style.opacity = distX; likeBadge.style.opacity = 0; superBadge.style.opacity = 0;
    }
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    const isVerticalSwipe = dy < -threshold && Math.abs(dy) > Math.abs(dx);
    if (isVerticalSwipe) {
      decide('super');
    } else if (dx > threshold) {
      decide('like');
    } else if (dx < -threshold) {
      decide('pass');
    } else {
      card.style.transition = 'transform .3s var(--ease)';
      card.style.transform = '';
      likeBadge.style.opacity = 0; passBadge.style.opacity = 0; superBadge.style.opacity = 0;
    }
  }

  card.addEventListener('mousedown', e => { onDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);

  card.addEventListener('touchstart', e => { const t = e.touches[0]; onDown(t.clientX, t.clientY); }, {passive:true});
  card.addEventListener('touchmove', e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, {passive:true});
  card.addEventListener('touchend', onUp);

  // ─── TOQUE NAS LATERAIS: direita = curtir, esquerda = passar ─────────────
  card.addEventListener('click', e => {
    if (wasDrag) return;
    if (e.target.closest('.m-info-btn')) return;
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x > rect.width / 2) decide('like');
    else decide('pass');
  });
}

// ─── PAINEL DE INFORMAÇÃO (bottom sheet) ────────────────────────────────────
function openInfo(id) {
  const it = ALL_ITEMS.find(i => i.id === id) || queue[0];
  if (!it) return;
  let sheet = document.getElementById('mInfoSheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.className = 'm-info-sheet';
    sheet.id = 'mInfoSheet';
    document.getElementById('mStage').appendChild(sheet);
  }
  const tagsHTML = (it.tags && it.tags.length)
    ? `<div class="m-info-tags">${it.tags.map(t => `<span class="m-info-tag">${t}</span>`).join('')}</div>`
    : '';
  sheet.innerHTML = `
    <div class="m-info-sheet-handle"></div>
    <button class="m-info-sheet-close" onclick="closeInfo()" aria-label="Fechar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
    </button>
    <div class="m-info-sheet-cat">${it.catLabel || it.cat} — ${BRAND_LABEL[it.brand]}</div>
    <p class="m-info-sheet-desc">Peça selecionada da coleção ${BRAND_LABEL[it.brand]}.</p>
    ${tagsHTML}
  `;
  requestAnimationFrame(() => {
    sheet.classList.add('open');
    document.getElementById('mInfoBackdrop').classList.add('open');
  });
  infoOpen = true;
}
function closeInfo() {
  const sheet = document.getElementById('mInfoSheet');
  if (sheet) sheet.classList.remove('open');
  document.getElementById('mInfoBackdrop').classList.remove('open');
  infoOpen = false;
}

// ─── MENSAGEM WHATSAPP AGRUPADA POR STATUS ──────────────────────────────────
function buildWaMessage() {
  const available   = likes.filter(l => l.status === 'available');
  const soldOut     = likes.filter(l => l.status === 'sold_out');
  const comingSoon  = likes.filter(l => l.status === 'coming_soon');

  const parts = [];
  parts.push('Olá! Dei match em algumas peças no My Favorite Match:');

  if (available.length) {
    parts.push(`\n\nDisponíveis (gostaria de mais informações):\n${available.map(l => `- ${l.name}${l.superLiked ? ' *[Favorito]*' : ''} (${l.price})`).join('\n')}`);
  }
  if (soldOut.length) {
    parts.push(`\n\nEsgotadas (gostaria de saber se há previsão de chegada/reposição):\n${soldOut.map(l => `- ${l.name}${l.superLiked ? ' *[Favorito]*' : ''}`).join('\n')}`);
  }
  if (comingSoon.length) {
    parts.push(`\n\nEm Breve (gostaria de saber a previsão de chegada):\n${comingSoon.map(l => `- ${l.name}${l.superLiked ? ' *[Favorito]*' : ''}`).join('\n')}`);
  }
  const extra = (document.getElementById('mOvMsg') || {}).value?.trim();
  if (extra) {
    parts.push(`\n\nMensagem: ${extra}`);
  }
  return parts.join('');
}

// `opts.final`: true = tela de encerramento do baralho (todos os
// reembaralhos automáticos já foram exibidos). Mesmo overlay/conteúdo do
// "Deu match!" normal, só muda o título e o botão de continuar.
function openMatchOverlay(opts) {
  const isFinal = !!(opts && opts.final);
  const titleEl = document.getElementById('mOvTitle');
  if (titleEl) titleEl.textContent = isFinal
    ? `Você teve ${likes.length} match${likes.length !== 1 ? 'es' : ''}`
    : 'Deu match!';
  document.getElementById('mOvSub').innerHTML = `Você já curtiu <b id="mOvCount">${likes.length}</b> peça${likes.length !== 1 ? 's' : ''}.`;
  document.getElementById('mOvList').innerHTML = likes.map(l => `
    <div class="m-ov-item">
      <span class="m-ov-item-name">${l.superLiked ? '<svg class="m-ov-star" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8L5.8 21l1.6-7L2 9.2l7.1-.6L12 2z"/></svg> ' : ''}${l.name} <span style="opacity:.5;">(${BRAND_LABEL[l.brand]})</span></span>
      ${l.status === 'available' ? `<span class="m-ov-item-price">${l.price}</span>` : ''}
      <span class="m-ov-item-status ${l.status}">${STATUS_LABEL_PT[l.status]}</span>
    </div>`).join('');
  const msgBox = document.getElementById('mOvMsg');
  if (msgBox) msgBox.value = '';
  const updateWaLink = () => {
    const msg = buildWaMessage();
    document.getElementById('mOvWa').href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  };
  updateWaLink();
  if (msgBox) msgBox.oninput = updateWaLink;
  const continueBtn = document.getElementById('mOvContinue');
  if (continueBtn) {
    if (isFinal) {
      continueBtn.textContent = 'Embaralhar e tentar de novo';
      continueBtn.onclick = () => restartLoop();
    } else {
      continueBtn.textContent = 'Continuar vendo catálogo';
      continueBtn.onclick = () => closeMatchOverlay();
    }
  }
  document.getElementById('mOv').classList.add('open');
  vibrate([20, 40, 20, 40, 30]);
  playMatchSound();
}
function closeMatchOverlay() {
  document.getElementById('mOv').classList.remove('open');
}

// ─── INIT ──────────────────────────────────────────────────────────────────
setFilter(filter);
setOccasion(occasion);

// Botão "Sair" volta para a página de onde o usuário veio (Bags ou Looks).
(function setExitTarget() {
  const from = new URLSearchParams(location.search).get('from');
  const exitUrl = from === 'looks' ? 'looks.html' : 'index.html';
  ['mExitConfig', 'mExitCard'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.href = exitUrl;
    // Ao sair do Match, desativa a tela cheia automaticamente (se estiver ativa).
    el.addEventListener('click', e => {
      if (isFullscreenActive()) {
        e.preventDefault();
        const exitFs = document.exitFullscreen || document.webkitExitFullscreen;
        Promise.resolve(exitFs ? exitFs.call(document) : null).finally(() => {
          if (window.mfbNavigateWithCurtain) window.mfbNavigateWithCurtain(exitUrl);
          else location.href = exitUrl;
        });
      }
    });
  });
})();

// ─── ATALHOS DE TECLADO — seta direita curte, esquerda passa, cima favorita,
// backspace desfaz (só quando o baralho já começou, sem overlay/info aberto,
// e sem estar digitando em algum campo de texto). ───────────────────────────
document.addEventListener('keydown', e => {
  if (!started) return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  const ovOpen = document.getElementById('mOv')?.classList.contains('open');
  if (ovOpen || infoOpen) return;

  if (e.key === 'ArrowRight') { e.preventDefault(); decide('like'); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); decide('pass'); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); decide('super'); }
  else if (e.key === 'Backspace') { e.preventDefault(); decide('undo'); }
});
</script>
