<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#21110D">
  <title>My Favorite Bags — Em breve no celular</title>
  <meta name="description" content="Em breve, a My Favorite Bags no seu celular.">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mobile-maintenance.css">
</head>
<body>
  <main class="maintenance-page">
    <div class="maintenance-background" aria-hidden="true"></div>
    <div class="maintenance-sheen" aria-hidden="true"></div>

    <section class="maintenance-content" aria-labelledby="maintenanceTitle">
      <img
        class="maintenance-logo"
        src="webp/LogoMFB_B.webp"
        alt="My Favorite Bags"
        width="1293"
        height="855"
      >

      <h1 class="maintenance-title" id="maintenanceTitle">
        <span class="maintenance-title-line">Em breve,</span>
        <strong class="maintenance-title-line">a My Favorite Bags</strong>
        <span class="maintenance-title-line">no seu celular</span>
      </h1>

      <p class="maintenance-copy">
        Enquanto isso, confira nossas bolsas na versão desktop ou acompanhe nosso Instagram.
      </p>

      <a
        class="maintenance-instagram"
        href="https://www.instagram.com/myfavorite.bagsrecife/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir o Instagram da My Favorite Bags"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>@myfavorite.bagsrecife</span>
      </a>

      <p class="maintenance-match-copy">
        Enquanto isso, experimente o<br>
        <span class="maintenance-match-brand">My Favorite Match</span>
      </p>
    </section>

    <div class="maintenance-match-dock" aria-hidden="false">
      <a
        class="maintenance-match-link"
        href="match.html"
        aria-label="Abrir o My Favorite Match"
      >
        <img
          class="maintenance-match-logo"
          src="webp/logo-my-favorite-match-mini.webp"
          alt="My Favorite Match"
          width="480"
          height="500"
        >
      </a>
    </div>
  </main>
</body>
</html>
